<!-- @dsCard group="Brand" viewport="700x230" name="Wordmark & ornament" subtitle="Cinzel caps with the gold rule-and-diamond" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream-50);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;color:var(--emerald-900)}.wm{font-family:var(--font-display);font-weight:600;font-size:52px;letter-spacing:.16em;background:linear-gradient(135deg,var(--gold-700),var(--gold-500),var(--gold-700));-webkit-background-clip:text;background-clip:text;color:transparent}.orn{display:flex;align-items:center;gap:10px;color:var(--gold-600)}.orn i{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-600))}.orn i.r{background:linear-gradient(90deg,var(--gold-600),transparent)}.orn b{width:8px;height:8px;transform:rotate(45deg);background:var(--gold-600)}.tag{font-family:var(--font-sans);font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--emerald-700)}</style></head>
<body><div class="wm">SEVANNA</div><div class="orn"><i></i><b></b><i class="r"></i></div><div class="tag">Academia de Cosmética</div></body></html>
