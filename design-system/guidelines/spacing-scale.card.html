<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base rhythm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--emerald-900);padding:22px 30px;font-family:var(--font-sans)}.row{display:flex;align-items:center;gap:14px;margin-bottom:9px}.bar{background:var(--gradient-gold);height:16px;border-radius:3px}.lbl{font-size:11px;color:var(--emerald-300);letter-spacing:.05em;width:150px}</style></head>
<body>
<div class="row"><span class="lbl">--space-2 · 8px</span><span class="bar" style="width:8px"></span></div>
<div class="row"><span class="lbl">--space-4 · 16px</span><span class="bar" style="width:16px"></span></div>
<div class="row"><span class="lbl">--space-5 · 24px</span><span class="bar" style="width:24px"></span></div>
<div class="row"><span class="lbl">--space-6 · 32px</span><span class="bar" style="width:32px"></span></div>
<div class="row"><span class="lbl">--space-8 · 64px</span><span class="bar" style="width:64px"></span></div>
</body></html>
