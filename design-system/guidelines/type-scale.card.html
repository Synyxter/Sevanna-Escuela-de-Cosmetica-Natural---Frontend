<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--emerald-900);padding:20px 30px;color:var(--gold-100);font-family:var(--font-serif)}.row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--divider);padding:7px 0}.t{flex:0 0 auto}.m{font-family:var(--font-sans);font-size:10px;letter-spacing:.05em;color:var(--emerald-300);margin-left:auto}</style></head>
<body>
<div class="row"><span class="t" style="font-size:40px;font-weight:600">Aa Display</span><span class="m">--fs-display / --fs-h1</span></div>
<div class="row"><span class="t" style="font-size:28px;font-weight:600">Aa Heading</span><span class="m">--fs-h2</span></div>
<div class="row"><span class="t" style="font-size:22px;font-style:italic">Aa Lede serif</span><span class="m">--fs-lead</span></div>
<div class="row"><span class="t" style="font-family:var(--font-sans);font-size:16px">Aa Body sans</span><span class="m">--fs-body</span></div>
<div class="row"><span class="t" style="font-family:var(--font-sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase">Aa Caption</span><span class="m">--fs-caption</span></div>
</body></html>
