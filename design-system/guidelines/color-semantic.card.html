<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success · Warning · Danger · Info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}.wrap{display:flex;gap:10px;padding:20px;background:var(--emerald-900)}.sw{flex:1;border-radius:var(--radius-sm);height:90px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}.n{font-size:11px;font-weight:600;letter-spacing:.06em;color:#fff}.h{font-size:10px;font-family:monospace;color:rgba(255,255,255,.8)}</style></head>
<body><div class="wrap">
<div class="sw" style="background:#357A58"><div class="n">Success</div><div class="h">#357A58</div></div>
<div class="sw" style="background:#C9962F"><div class="n">Warning</div><div class="h">#C9962F</div></div>
<div class="sw" style="background:#A63A2E"><div class="n">Danger</div><div class="h">#A63A2E</div></div>
<div class="sw" style="background:#2F6F8C"><div class="n">Info</div><div class="h">#2F6F8C</div></div>
</div></body></html>
