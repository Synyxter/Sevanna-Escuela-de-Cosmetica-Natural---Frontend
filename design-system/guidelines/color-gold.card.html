<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}.wrap{display:flex;gap:10px;padding:20px;background:var(--emerald-900)}.sw{flex:1;border-radius:var(--radius-sm);height:118px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}.n{font-size:11px;font-weight:600;letter-spacing:.06em;color:#08210F}.h{font-size:10px;color:#3B2E0E;font-family:monospace}.foil{flex:1.4;background:var(--gradient-gold)}</style></head>
<body><div class="wrap">
<div class="sw" style="background:#8C6A2E"><div class="n" style="color:#FBF1D6">700</div><div class="h" style="color:#FBF1D6">#8C6A2E</div></div>
<div class="sw" style="background:#AC853C"><div class="n" style="color:#FBF1D6">600</div><div class="h" style="color:#3B2E0E">#AC853C</div></div>
<div class="sw" style="background:#C69F53"><div class="n">500</div><div class="h">#C69F53</div></div>
<div class="sw" style="background:#E3C072"><div class="n">300</div><div class="h">#E3C072</div></div>
<div class="sw" style="background:#F0D89B"><div class="n">200</div><div class="h">#F0D89B</div></div>
<div class="sw foil"><div class="n">Foil gradient</div><div class="h">--gradient-gold</div></div>
</div></body></html>
