<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & shadows" subtitle="Soft corners, warm elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--emerald-900);padding:24px 30px;font-family:var(--font-sans);display:flex;gap:22px;align-items:center}.box{width:96px;height:80px;background:var(--emerald-800);border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}.t{font-size:10px;color:var(--emerald-300);letter-spacing:.05em}</style></head>
<body>
<div class="box" style="border-radius:var(--radius-sm)"><span class="t">sm · 8</span></div>
<div class="box" style="border-radius:var(--radius-md)"><span class="t">md · 12</span></div>
<div class="box" style="border-radius:var(--radius-lg)"><span class="t">lg · 18</span></div>
<div class="box" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"><span class="t">shadow-md</span></div>
<div class="box" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-gold)"><span class="t">shadow-gold</span></div>
</body></html>
